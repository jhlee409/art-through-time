<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Through Time · 화가와 그림의 역사</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="extras.css" />
    <link rel="stylesheet" href="rules-check.css" />
  <link rel="stylesheet" href="./uhangul/uhangul-runtime.css" data-uhangul-integration="v0.5.4">
</head>
  <body class="auth-pending">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span><span>Art Through Time</span></div>
        <div class="display-mode" role="group" aria-label="이름 표기 방식">
          <button class="display-mode-button active" type="button" data-display-mode="korean" aria-pressed="true">한국어</button>
          <button class="display-mode-button" type="button" data-display-mode="uhangul" aria-pressed="false">uHangul</button>
        </div>
        <div class="sidebar-section-tools" role="group" aria-label="미술 자료">
          <button id="movement-atlas-button" class="movement-atlas-button" type="button" title="미술 사조의 이해" aria-label="미술 사조의 이해">사조</button>
          <button id="techniques-button" class="movement-atlas-button techniques-button" type="button" title="미술 기법의 이해" aria-label="미술 기법의 이해">기법</button>
          <button id="topics-button" class="movement-atlas-button techniques-button" type="button" title="주제와 사건" aria-label="주제와 사건">주제-사건</button>
        </div>
        <label class="artist-search"><span class="sr-only" data-i18n="searchArtists">화가 검색</span><input id="artist-search" type="search" autocomplete="off" data-i18n-placeholder="searchArtists" placeholder="화가 이름 검색" /></label>
        <div class="sidebar-heading">
          <p data-i18n="collection">나의 화가 목록</p>
          <label class="sort-select"><span data-i18n="sort">정렬</span><select id="sort"><option value="name" data-i18n="nameAsc">이름순</option><option value="birth" data-i18n="birthAsc" selected>생년순</option></select></label>
        </div>
        <nav id="artist-list" class="artist-list" aria-label="화가 목록"></nav>
        <button id="add-button" class="add-button" type="button" title="화가와 그림 일괄 추가" aria-label="화가와 그림 일괄 추가"><span aria-hidden="true">+</span></button>
        <div class="language"><button id="artist-list-en-button" class="language-button" type="button" aria-pressed="false">EN</button><button id="migration-export-button" class="admin-export-button hidden" type="button">FIREBASE 내보내기</button></div>
        <button id="logout-button" class="logout-button" type="button">로그아웃</button>
      </aside>
      <main class="main-area">
        <section id="timeline-panel" class="timeline-panel"></section>
        <aside id="detail-panel" class="detail-panel"></aside>
      </main>
    </div>
    <button id="movement-logout-button" class="logout-button movement-logout-button" type="button">로그아웃</button>
    <dialog id="auth-dialog" class="auth-dialog">
      <form id="auth-form">
        <p class="eyebrow">ART THROUGH TIME</p>
        <h2>관리자 인증</h2>
        <p class="dialog-description">관리자는 이메일과 비밀번호를 입력하세요. 건너뛰면 자료를 읽기 전용으로 볼 수 있습니다.</p>
        <label><span>관리자 이메일</span><input id="auth-email" type="email" autocomplete="username" inputmode="email" /></label>
        <label><span>비밀번호</span><input id="auth-password" type="password" autocomplete="current-password" /></label>
        <p id="auth-message" class="form-message hidden" aria-live="polite"></p>
        <div class="auth-actions"><button id="auth-skip" class="auth-skip" type="button">건너뛰기</button><button class="save" type="submit">관리자로 열기</button></div>
      </form>
    </dialog>
    <dialog id="add-dialog">
      <form method="dialog" id="add-form">
        <button id="close-add-dialog" class="close" type="button" aria-label="닫기">×</button>
        <p class="eyebrow" data-i18n="newRecord">NEW RECORD</p><h2 data-i18n="addTitle">화가와 그림 일괄 추가</h2>
        <p class="dialog-description" data-i18n="addHelp">이름을 입력한 뒤 자동완성 목록에서 정확한 후보를 선택해 저장하세요.</p>
        <label><span data-i18n="entryType">추가할 항목</span><select id="entry-type"><option value="artist" data-i18n="artist">화가</option><option value="url" data-i18n="painting">그림 웹주소</option></select></label>
        <label class="entry-name-field"><span id="entry-name-label" data-i18n="name">이름</span><input id="entry-name" required autocomplete="off" /><div id="suggestions" class="suggestions hidden" role="listbox"></div></label>
        <label class="artist-full-name-field hidden"><span data-i18n="fullName">Full Name (목록·연표·HTML 표기)</span><input id="entry-full-name" autocomplete="off" placeholder="예: 디 본도네, 조토" /></label><p id="form-message" class="form-message hidden" aria-live="polite"></p>
        <label class="artist-aliases-field hidden"><span data-i18n="artistAliases">별명·줄임말 (쉼표로 구분)</span><input id="entry-artist-aliases" autocomplete="off" placeholder="예: 조토, Giotto di Bondone" /></label>
        <label class="artist-field"><span data-i18n="birthYear">출생 연도 (선택)</span><input id="entry-birth" type="number" min="1" max="2100" /></label>
        <label class="artwork-field hidden"><span data-i18n="artistName">화가 이름</span><input id="entry-artist" list="artist-names" autocomplete="off" /><datalist id="artist-names"></datalist></label>
        <label class="artwork-field hidden"><span data-i18n="madeYear">제작 연도</span><input id="entry-year" type="number" min="1" max="2100" /></label>
        <button class="save" value="default" data-i18n="save">저장하기</button>
      </form>
    </dialog>
    <dialog id="add-artwork-dialog">
      <form id="add-artwork-form">
        <button id="close-add-artwork-dialog" class="close" type="button" aria-label="닫기">×</button>
        <p class="eyebrow" data-i18n="newRecord">NEW RECORD</p><h2 data-i18n="addArtworkTitle">그림 1점 추가</h2>
        <section class="artwork-source-section">
          <label><span data-i18n="artworkPage">작품 웹페이지 주소</span><input id="artwork-page-url" type="url" inputmode="url" placeholder="https://" /></label>
          <button class="artwork-source-save" type="submit" name="artwork-source" value="web" formnovalidate data-i18n="addFromWeb">웹 주소로 추가</button>
        </section>
        <section class="artwork-source-section local-artwork-source">
          <p class="artwork-source-heading" data-i18n="localArtwork">로컬 이미지</p>
          <label><span data-i18n="chooseLocalImage">파일 선택</span><input id="local-artwork-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" /></label>
          <div id="local-artwork-details" class="hidden">
            <label><span data-i18n="localArtworkTitle">작품 제목</span><input id="local-artwork-title-input" autocomplete="off" disabled required /></label>
            <label><span data-i18n="localArtworkYear">제작 연도 (예: 1500-1505)</span><input id="local-artwork-year-input" type="text" inputmode="numeric" placeholder="1500 또는 1500-1505" pattern="[0-9]{1,4}(?:\s*[-–]\s*[0-9]{1,4})?" disabled required /></label>
            <button class="save" type="submit" name="artwork-source" value="local" data-i18n="addFromLocal">연표에 추가</button>
          </div>
        </section>
        <p id="add-artwork-message" class="form-message hidden" aria-live="polite"></p>
      </form>
    </dialog>
    <dialog id="historical-event-dialog"></dialog>
    <section id="slideshow" class="slideshow hidden" aria-live="polite">
      <button id="close-slideshow" class="close-slideshow" type="button" aria-label="슬라이드 쇼 종료">×</button>
      <div id="slideshow-stage" class="slideshow-stage"></div>
      <div id="slideshow-caption" class="slideshow-caption"></div>
    </section>
    <script src="app.js"></script>
    <script src="rules-check.js?v=20260821-3"></script>
  <script defer src="./uhangul/uhangul-runtime.js" data-uhangul-integration="v0.5.4"></script>
</body>
</html>
