<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주제-사건 · Art Through Time</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="topics.css">
  <link rel="stylesheet" href="rules-check.css">
  <style>.topic-title-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.topic-title-row #hint{margin-bottom:0}.topic-title-row button{flex:none;margin-top:4px;border:1px solid #aebba8;border-radius:6px;background:#f9f7f1;padding:8px 11px;color:#425043;font-weight:700}.topic-title-row button:hover{background:#dfe8d9}.topic-year-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic-form-error{min-height:1.25em;color:#a43d27;font-size:12px}.topic-artwork-dialog[open]{z-index:100}.topic-card .topic-replace-image,.topic-card .topic-delete-artwork{position:absolute!important;z-index:4;left:auto!important;width:34px!important;height:34px!important;margin:0;padding:0;border:1px solid #aebba8!important;border-radius:50%;background:#fffdf8!important;color:#425043!important;opacity:1!important;font-size:23px;line-height:28px;text-align:center;box-shadow:0 1px 4px #0004;cursor:pointer}.topic-card .topic-replace-image{right:8px;top:278px!important}.topic-card .topic-delete-artwork{right:8px;top:8px!important;color:#a43d27!important}.topic-card .topic-replace-image:hover,.topic-card .topic-delete-artwork:hover{background:#dfe8d9!important}@media(max-width:600px){.topic-title-row{display:block}.topic-title-row button{margin-top:14px}}</style>
</head>
<body>
  <div class="topics-shell">
    <aside>
      <a href="index.html">Art Through Time</a>
      <h1>주제-사건</h1>
      <label class="topic-search"><input id="topic-search" type="search" placeholder="주제·사건 검색"></label>
      <input id="topic-artwork-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      <input id="topic-image-replace-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      <div class="topic-sort" aria-label="사건 목록 정렬">
        <button id="sort-asc" type="button" aria-label="오름차순 정렬" title="오름차순 정렬">↑</button>
        <button id="sort-desc" type="button" aria-label="내림차순 정렬" title="내림차순 정렬">↓</button>
      </div>
      <nav id="topics"></nav>
      <button id="topic-logout" class="topic-logout" type="button">로그아웃</button>
    </aside>
    <main><header><div class="topic-title-row"><div><h2 id="title"></h2><p id="hint">주제를 선택하세요</p></div><div><button class="rules-check-button" type="button" data-rules-check hidden></button><button id="topic-add-artwork" type="button" hidden>＋ 그림 추가</button></div></div></header><div id="axis"></div></main>
    <aside id="detail"><p>그림을 클릭하면 설명이 표시됩니다.</p></aside>
  </div>
  <dialog id="topic-artwork-dialog"><form id="topic-artwork-form" method="dialog"><button class="close" type="button" data-close-topic-dialog aria-label="닫기">×</button><h2>그림 추가</h2><p id="topic-artwork-file-name" class="dialog-description"></p><label>제목<input id="topic-artwork-title" name="title" required></label><div class="topic-year-fields"><label>시작 연도<input id="topic-artwork-start" name="startYear" type="number" min="1" required></label><label>끝 연도<input id="topic-artwork-end" name="endYear" type="number" min="1" required></label></div><p id="topic-artwork-error" class="topic-form-error" aria-live="polite"></p><button class="save" type="submit">저장</button></form></dialog>
  <script src="topics.js"></script>
  <script src="rules-check.js"></script>
</body>
</html>
